---
id: https://w3id.org/astra/universe
name: universe
description: |-
  Universe specification models. A universe is a complete set of
  decisions across the entire analysis tree.
# Placeholder version. The real version is injected at build time from the
# latest git tag (or RELEASE_VERSION) — see `_stage-versioned` in the justfile.
version: 0.0.0
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  astra: https://w3id.org/astra/
  linkml: https://w3id.org/linkml/

default_prefix: astra
default_range: string

imports:
  - linkml:types
  - actor

# ==========================================================================
# Classes
# ==========================================================================

classes:

  DecisionSelection:
    description: >-
      A mapping from a decision ID to the selected option ID, optionally
      carrying who selected and who reviewed the pick. In YAML the value
      may be the scalar shorthand (`decision_id: option_id`) or an object
      with `option_id` plus attribution fields — see the `decisions`
      slots on Universe and UniverseNode.
    attributes:
      decision_id:
        identifier: true
        description: ID of the decision
      option_id:
        required: true
        description: ID of the selected option
      selected_by:
        range: Attribution
        any_of:
          - range: string
          - range: Attribution
        inlined: true
        description: >-
          Who chose this option for this universe — an actor id (a key in
          the analysis's `actors` registry), or an {actor, role} object.
      reviewed_by:
        range: Attribution
        any_of:
          - range: string
          - range: Attribution
        inlined: true
        description: >-
          Who reviewed the selection — an actor id, or an {actor, role}
          object. Typically a human signing off on an agent's pick.

  UniverseNode:
    description: >-
      A universe node mirroring the analysis tree structure.
      Represents decision selections at a specific sub-analysis node.
    attributes:
      id:
        identifier: true
        pattern: "^(?!(inputs|outputs|decisions|findings|prior_insights|analyses|options|content|actors)$)[a-z][a-z0-9_]*$"
        description: Node identifier (the sub-analysis key)
      universe:
        description: >-
          Name of a universe in the sub-analysis's universes/ directory.
          Alternative to inline decisions.
      decisions:
        # Explicit union: with attribution slots DecisionSelection is no
        # longer a LinkML "simple dict" class, so the scalar shorthand
        # (decision_id: option_id) must be declared, not inferred.
        range: DecisionSelection
        any_of:
          - range: string
          - range: DecisionSelection
        multivalued: true
        inlined: true
        description: >-
          Decision selections — scalar shorthand (decision_id: option_id)
          or an object with option_id plus attribution fields.
      analyses:
        range: UniverseNode
        multivalued: true
        inlined: true
        description: Sub-analysis universe selections

  Universe:
    description: >-
      A universe specification - a complete set of decisions
      across the entire analysis tree.
    attributes:
      id:
        identifier: true
        pattern: "^[a-z][a-z0-9_-]*$"
        description: Unique identifier for the universe
      description:
        description: Free-prose description of this universe.
      decisions:
        # Same explicit union as UniverseNode.decisions — see note there.
        range: DecisionSelection
        any_of:
          - range: string
          - range: DecisionSelection
        multivalued: true
        inlined: true
        description: >-
          Root-level decision selections — scalar shorthand or an object
          with option_id plus attribution fields.
      analyses:
        range: UniverseNode
        multivalued: true
        inlined: true
        description: Sub-analysis universe selections
